name: Build APK WebView

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Nombre de la carpeta dentro de profiles/"
        required: true
        default: "control"
        type: string
      vista:
        description: "Vista de la web (perfil = usar la del config.properties)"
        required: true
        default: "perfil"
        type: choice
        options: [perfil, pc, movil]
      orientacion:
        description: "Orientacion de la app (perfil = usar la del config.properties)"
        required: true
        default: "perfil"
        type: choice
        options: [perfil, horizontal, vertical, auto]
      ancho_pc:
        description: "Ancho de la vista PC en px. Vacio = el del perfil. Ej: 1280, 1440, 1920"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar perfil
        shell: bash
        env:
          IN_PROFILE: ${{ inputs.profile }}
          IN_VISTA: ${{ inputs.vista }}
          IN_ORIENTACION: ${{ inputs.orientacion }}
          IN_ANCHO: ${{ inputs.ancho_pc }}
        run: |
          PROFILE="${IN_PROFILE:-control}"
          if [[ ! "$PROFILE" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "Nombre de perfil no valido: $PROFILE"
            exit 1
          fi
          if [ ! -f "profiles/$PROFILE/config.properties" ]; then
            echo "No existe profiles/$PROFILE/config.properties"
            exit 1
          fi
          if [ ! -f "profiles/$PROFILE/icon.png" ]; then
            echo "No existe profiles/$PROFILE/icon.png"
            exit 1
          fi
          cp "profiles/$PROFILE/config.properties" active-config.properties
          cp "profiles/$PROFILE/icon.png" app-icon-source.png
          sed -i 's/\r$//' active-config.properties
          echo "" >> active-config.properties

          set_cfg() {
            sed -i "/^$1=/d" active-config.properties
            echo "$1=$2" >> active-config.properties
          }

          # Valores elegidos al ejecutar el workflow (sobrescriben al perfil)
          if [ -n "$IN_VISTA" ] && [ "$IN_VISTA" != "perfil" ]; then set_cfg VISTA "$IN_VISTA"; fi
          if [ -n "$IN_ORIENTACION" ] && [ "$IN_ORIENTACION" != "perfil" ]; then set_cfg ORIENTACION "$IN_ORIENTACION"; fi
          if [ -n "$IN_ANCHO" ]; then
            if [[ ! "$IN_ANCHO" =~ ^[0-9]{3,4}$ ]]; then
              echo "ancho_pc debe ser un numero de 3 o 4 cifras (ej. 1280). Recibido: $IN_ANCHO"
              exit 1
            fi
            set_cfg ANCHO_PC "$IN_ANCHO"
          fi

          APP_NAME=$(grep '^NOMBRE=' active-config.properties | cut -d= -f2-)
          APP_ID=$(grep '^ID=' active-config.properties | cut -d= -f2-)
          VERSION_NAME=$(grep '^VERSION=' active-config.properties | cut -d= -f2-)

          if ! echo "$APP_ID" | grep -Eq '^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$'; then
            echo "ID no parece un applicationId valido: $APP_ID"
            exit 1
          fi

          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> active-config.properties

          SAFE_NAME=$(echo "$APP_NAME" | tr ' /' '__' | tr -cd '[:alnum:]_.-')
          echo "APK_NAME=${SAFE_NAME}-v${VERSION_NAME}-build${VERSION_CODE}.apk" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE" >> "$GITHUB_ENV"

          {
            echo "### Configuracion de la APK"
            echo '```'
            grep -E '^(NOMBRE|URL|ID|VISTA|ANCHO_PC|USER_AGENT_PC|ORIENTACION)=' active-config.properties
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Instalar ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Preparar iconos Android
        shell: bash
        run: |
          rm -rf app/src/main/res/mipmap app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          convert app-icon-source.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert app-icon-source.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert app-icon-source.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert app-icon-source.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert app-icon-source.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Renombrar APK
        shell: bash
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/${APK_NAME}"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: output/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30
